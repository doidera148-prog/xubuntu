autoinstall:
  version: 1

  locale: pt_BR.UTF-8
  timezone: America/Maceio

  keyboard:
    layout: br
    variant: ""

  source:
    id: xubuntu-desktop

  identity:
    hostname: xubuntu-casa
    username: araujo
    realname: "Araujo"
    password: '$6$RSVvzi7h$KxJFnz6HcOvgZvolo5DAROVE3W0Md4OZH3WqwZZfmYMSMVQsT/ByuoDo2utOFdvi5WeHtb/vak8L2TeOy964K.'

  storage:
    layout:
      name: direct

  apt:
    mirror-selection:
      primary:
        - uri: http://br.archive.ubuntu.com/ubuntu
          arches:
            - amd64
    fallback: offline-install

  codecs:
    install: true

  drivers:
    install: true

  ssh:
    install-server: true
    allow-pw: true

  late-commands:
    - >-
      curtin in-target --target=/target -- grub-install
      --target=x86_64-efi
      --efi-directory=/boot/efi
      --bootloader-id=ubuntu
      --removable
      --recheck

    - curtin in-target --target=/target -- update-grub

  user-data:
    write_files:
      - path: /etc/lightdm/lightdm.conf.d/99-autologin.conf
        owner: root:root
        permissions: "0644"
        content: |
          [Seat:*]
          autologin-user=araujo
          autologin-user-timeout=0

  shutdown: reboot
