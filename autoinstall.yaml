#cloud-config
autoinstall:
  version: 1
  locale: pt_BR.UTF-8
  timezone: America/Maceio
  keyboard:
    layout: br
    variant: abnt2
  network:
    version: 2
    renderer: NetworkManager
    wifis:
      wlif:
        match:
          name: wl*
        dhcp4: true
        dhcp6: true
        access-points:
          "William2":
            password: "araujo321"
  identity:
    hostname: xubuntu-casa
    username: araujo
    realname: "Araujo"
    # Senha SHA-512 hash para: araujo321
    password: "$6$rounds=656000$K7m3Z9pQ2n8vX5bL$TqH2yN8vZ3wF4jP6mK9rD2sL5uB8xC1eG4hJ7kM0pN3qR6tS9vW2xY5zA8bC1dE4"
  packages:
    - xubuntu-desktop
    - ubuntu-restricted-extras
  apt:
    primary:
      - arches: [default]
        uri: http://br.archive.ubuntu.com/ubuntu
  storage:
    layout:
      name: direct
    # Se desejar comportamento determinístico, especifique device/partitions aqui
  late-commands:
    # Usar --removable para corrigir UEFI NVRAM em BIOS mais antigas
    # Usar --recheck para forçar redetecção de discos
    - curtin in-target -- grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=ubuntu --removable --recheck
    - curtin in-target -- update-grub
    - curtin in-target -- mkdir -p /boot/efi/EFI/Boot
    # Copiar bootloader fallback com verificação de Secure Boot
    - curtin in-target -- bash -c 'if [ -f /boot/efi/EFI/ubuntu/shimx64.efi ]; then cp /boot/efi/EFI/ubuntu/shimx64.efi /boot/efi/EFI/Boot/Bootx64.efi; elif [ -f /boot/efi/EFI/ubuntu/grubx64.efi ]; then cp /boot/efi/EFI/ubuntu/grubx64.efi /boot/efi/EFI/Boot/Bootx64.efi; fi'
    # Configurar autologin para o usuário araujo via LightDM
    - curtin in-target -- mkdir -p /etc/lightdm/lightdm.conf.d
    - curtin in-target -- bash -c 'echo "[SeatDefaults]" > /etc/lightdm/lightdm.conf.d/99-autologin.conf && echo "autologin-user=araujo" >> /etc/lightdm/lightdm.conf.d/99-autologin.conf && echo "autologin-user-timeout=0" >> /etc/lightdm/lightdm.conf.d/99-autologin.conf'
