#cloud-config
autoinstall:
  version: 1
  locale: pt_BR.UTF-8
  keyboard:
    layout: br
  network:
    version: 2
    renderer: NetworkManager
    wifis:
      wlif:
        match:
          name: wl*
        dhcp4: true
        dhcp6: true
        access-points:
          "William2":
            password: "araujo321"
  identity:
    hostname: xubuntu-casa
    username: araujo
    realname: "Araujo"
    # Mantive o hash de senha SHA-512 existente (não colocar senha em texto claro)
    password: "$6$BaquRV4VMK9z2ct3$l06wQFD1AMyplrHKUKTiB.8PKFVNjJxmrumA2MgUZP2bYExM04bnJimYNERru5CHfgNnbFKj7.nwrROZ63Wkd1"
  packages:
    - xubuntu-desktop
    - ubuntu-restricted-extras
  snaps:
    - name: firefox
    - name: snap-store
    - name: snapd-desktop-integration
    - name: gtk-common-themes
  storage:
    layout:
      name: direct
    # Se desejar comportamento determinístico, especifique device/partitions aqui
  late-commands:
    # Usar --removable para corrigir UEFI NVRAM em BIOS mais antigas
    # Usar --recheck para forçar redetecção de discos
    - curtin in-target -- grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=ubuntu --removable --recheck
    - curtin in-target -- update-grub
    - curtin in-target -- mkdir -p /boot/efi/EFI/Boot
    - curtin in-target -- cp /boot/efi/EFI/ubuntu/grubx64.efi /boot/efi/EFI/Boot/Bootx64.efi
